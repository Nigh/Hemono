services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hemono-backend
    environment:
      PB_DATA_DIR: /pb_data
      TZ: Asia/Shanghai
    volumes:
      - hemono_pb_data:/pb_data
    restart: unless-stopped
    networks:
      - hemono-network
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hemono-frontend
    restart: unless-stopped
    networks:
      - hemono-network
    expose:
      - "5173"

volumes:
  hemono_pb_data:
    driver: local

networks:
  hemono-network:
    driver: bridge
