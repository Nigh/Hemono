root = "."
tmp_dir = "tmp"

[build]
  cmd = "CGO_ENABLED=1 go build -o ./tmp/hemono ."
  
  entrypoint = ["./tmp/hemono"]
  
  args_bin = ["serve", "--http=0.0.0.0:8090", "--dir=/pb_data"]
  
  include_ext = ["go", "tpl", "tmpl", "html", "toml"]
  exclude_dir = ["assets", "tmp", "vendor", "pb_data"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[screen]
  clear_on_rebuild = true
